<svg xmlns="http://www.w3.org/2005/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="atomGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#ef4444"/>
      <stop offset="60%" stop-color="#991b1b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <filter id="redBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo Hexagonal/Circular Tático -->
  <rect width="512" height="512" rx="64" fill="#0a0a0a"/>
  <rect x="8" y="8" width="496" height="496" rx="56" fill="none" stroke="#262626" stroke-width="4"/>
  <rect x="24" y="24" width="464" height="464" rx="44" fill="none" stroke="#3b1515" stroke-width="2"/>

  <!-- Cantoneiras Táticas -->
  <path d="M 40 70 L 40 40 L 70 40" fill="none" stroke="#ef4444" stroke-width="5"/>
  <path d="M 472 70 L 472 40 L 442 40" fill="none" stroke="#ef4444" stroke-width="5"/>
  <path d="M 40 442 L 40 472 L 70 472" fill="none" stroke="#ef4444" stroke-width="5"/>
  <path d="M 472 442 L 472 472 L 442 472" fill="none" stroke="#ef4444" stroke-width="5"/>

  <!-- Órbitas Atômicas -->
  <g transform="translate(256, 256)" filter="url(#redBlur)">
    <!-- Órbita 1 -->
    <ellipse cx="0" cy="0" rx="190" ry="70" fill="none" stroke="#ef4444" stroke-width="5" transform="rotate(0)"/>
    <!-- Órbita 2 -->
    <ellipse cx="0" cy="0" rx="190" ry="70" fill="none" stroke="#ef4444" stroke-width="5" transform="rotate(60)"/>
    <!-- Órbita 3 -->
    <ellipse cx="0" cy="0" rx="190" ry="70" fill="none" stroke="#ef4444" stroke-width="5" transform="rotate(120)"/>

    <!-- Elétrons em Órbita -->
    <circle cx="190" cy="0" r="8" fill="#ffffff" filter="drop-shadow(0 0 6px #ef4444)"/>
    <circle cx="-95" cy="164.5" r="8" fill="#ffffff" filter="drop-shadow(0 0 6px #ef4444)"/>
    <circle cx="-95" cy="-164.5" r="8" fill="#ffffff" filter="drop-shadow(0 0 6px #ef4444)"/>

    <!-- Anel Interno -->
    <circle cx="0" cy="0" r="85" fill="none" stroke="#e11d1d" stroke-width="3" stroke-dasharray="8 6"/>

    <!-- Núcleo Quântico Central -->
    <circle cx="0" cy="0" r="50" fill="url(#atomGlow)"/>
    <circle cx="0" cy="0" r="22" fill="#ffffff" filter="drop-shadow(0 0 10px #ef4444)"/>
  </g>
</svg>
